<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b6d"><link rel="manifest" href="manifest.webmanifest"><title>AIIMS CRE Mock Test</title><style>body{margin:0;font-family:Arial,sans-serif;background:#eef3f8;color:#172033}header{background:#123b6d;color:#fff;padding:14px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:5}.wrap{max-width:1100px;margin:auto;padding:12px}.card{background:#fff;padding:16px;border-radius:14px;margin:10px 0;box-shadow:0 2px 12px #0001}button{border:0;border-radius:8px;padding:10px 14px;margin:4px;cursor:pointer}.p{background:#1769aa;color:#fff}.g{background:#159447;color:#fff}.d{background:#c62828;color:#fff}.l{background:#e8edf3}input,textarea,select{padding:10px;width:100%;box-sizing:border-box;margin:5px 0;border:1px solid #ccd5df;border-radius:8px}textarea{min-height:100px}.hide{display:none}.opts button{display:block;width:100%;text-align:left;background:#f8fafc;border:2px solid #dbe3ec}.opts .sel{border-color:#1769aa;background:#e5f2ff}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}.qn{background:#e8edf2}.done{background:#b7e6c5}.cur{outline:3px solid #1769aa}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{text-align:center;background:#f3f6f9;padding:12px;border-radius:8px}.right{background:#e8f7ed;padding:10px;border-radius:8px;margin:7px 0}.wrong{background:#fff0f0;padding:10px;border-radius:8px;margin:7px 0}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}.qedit{border:1px solid #d8e0e8;border-radius:10px;padding:12px;margin:10px 0;background:#fafcfe}.small{font-size:13px;color:#5d6875}@media(max-width:600px){.grid{grid-template-columns:repeat(5,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><header><b>AIIMS CRE Mock Test</b><span id="timer">90:00</span></header><div class="wrap"><section id="home" class="card"><h2>AIIMS CRE Mock Test</h2><p>100 प्रश्न • 90 मिनट • सही +4 • गलत −1 • छोड़ा 0</p><button class="p" onclick="student()">विद्यार्थी Test</button><button class="g" onclick="adminLogin()">Owner / Admin</button></section><section id="student" class="hide card"><h3>विद्यार्थी का नाम</h3><input id="name" placeholder="नाम"><div id="tests"></div></section><section id="exam" class="hide"><div class="card"><b id="num"></b><span id="count" style="float:right"></span><h3 id="question"></h3><div id="options" class="opts"></div><button class="l" onclick="prev()">पिछला</button><button class="p" onclick="next()">अगला</button><button class="l" onclick="clearAnswer()">उत्तर हटाएँ</button><button class="d" onclick="submitTest()">Submit Test</button></div><div class="card"><b>प्रश्न सूची</b><div id="qgrid" class="grid"></div></div></section><section id="result" class="hide"><div class="card"><h2>परिणाम</h2><div class="stats"><div class="stat"><b id="score"></b><br>अंक / 400</div><div class="stat"><b id="correct"></b><br>सही</div><div class="stat"><b id="wrong"></b><br>गलत</div><div class="stat"><b id="skipped"></b><br>छोड़े</div></div><h3 id="rank"></h3></div><div class="card"><h3>आपके दिए उत्तर और सही उत्तर</h3><div id="review"></div></div><div class="card"><h3>Feedback / Comment</h3><textarea id="feedback" placeholder="अपनी राय लिखें"></textarea><button class="p" onclick="sendFeedback()">Feedback भेजें</button></div></section><section id="admin" class="hide"><div class="card"><h2>Owner / Admin</h2><button class="p" onclick="adminTests()">Tests</button><button class="g" onclick="newTest()">+ नया Test जोड़ें</button><button class="l" onclick="adminResults()">सभी Results / Rank</button><button class="l" onclick="adminFeedback()">Feedback</button><button class="l" onclick="show('home')">Logout</button></div><div id="adminBody" class="card"></div></section></div><script>
const SUPABASE_URL="https://dqumlteggtfygpssjtzk.supabase.co";const SUPABASE_ANON_KEY="sb_publishable_Rfvy1drDWb-fXgP37UdEAw_QWg0X_cu";const ADMIN_CODE="8890";let tests=[],test=null,idx=0,answers=[],end=0,lastResultId=null;const $=x=>document.getElementById(x);const show=x=>{["home","student","exam","result","admin"].forEach(y=>$(y).classList.add("hide"));$(x).classList.remove("hide")};async function api(t,m="GET",b=null,q=""){let h={"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY,"Content-Type":"application/json","Prefer":"return=representation"};let r=await fetch(SUPABASE_URL+"/rest/v1/"+t+q,{method:m,headers:h,body:b?JSON.stringify(b):null});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
async function student(){show("student");try{tests=await api("tests","GET",null,"?select=id,name,duration,questions,published&published=eq.true&order=id.desc");$("tests").innerHTML=tests.length?tests.map(t=>`<div class="card"><b>${esc(t.name)}</b><br>${t.duration} मिनट • ${t.questions.length} प्रश्न<br><button class="p" onclick="start(${t.id})">Test शुरू करें</button></div>`).join(""):"अभी कोई Published Test उपलब्ध नहीं है।"}catch(e){alert("Test लोड नहीं हुआ: "+e.message)}}function start(id){let n=$("name").value.trim();if(!n)return alert("नाम लिखें");test=tests.find(x=>x.id===id);if(!test||!Array.isArray(test.questions)||test.questions.length!==100)return alert("यह Test 100 प्रश्न वाला होना चाहिए।");idx=0;answers=Array(100).fill(null);end=Date.now()+test.duration*60000;show("exam");draw();clock()}function clock(){let s=Math.max(0,Math.ceil((end-Date.now())/1000));$("timer").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");if(s===0){submitTest(true);return}setTimeout(clock,500)}function draw(){let q=test.questions[idx];$("num").textContent=`प्रश्न ${idx+1}/100`;$("count").textContent=`उत्तर दिए: ${answers.filter(x=>x!==null).length}`;$("question").textContent=q.q;$("options").innerHTML=q.o.map((v,j)=>`<button class="${answers[idx]===j?"sel":""}" onclick="answers[idx]=${j};draw()">${"ABCD"[j]}. ${esc(v)}</button>`).join("");$("qgrid").innerHTML=Array.from({length:100},(_,k)=>`<button class="qn ${answers[k]!==null?"done ":""} ${k===idx?"cur":""}" onclick="idx=${k};draw()">${k+1}</button>`).join("")}function next(){if(idx<99){idx++;draw()}}function prev(){if(idx>0){idx--;draw()}}function clearAnswer(){answers[idx]=null;draw()}
async function submitTest(auto=false){if(!auto&&!confirm("क्या Test Submit करना है?"))return;let c=0,w=0,s=0;answers.forEach((v,k)=>v===null?s++:v===test.questions[k].a?c++:w++);let score=c*4-w;let reviewData=test.questions.map((q,k)=>({user:answers[k],correctIndex:q.a,correct:answers[k]===q.a}));try{let rows=await api("results","POST",{test_id:test.id,student_name:$("name").value,score,correct:c,wrong:w,skipped:s,answers,review:reviewData});lastResultId=rows[0].id;let ranks=await api("results","GET",null,"?select=id,score&test_id=eq."+test.id+"&order=score.desc,id.asc");let me=ranks.findIndex(x=>x.id===lastResultId)+1;show("result");$("score").textContent=score;$("correct").textContent=c;$("wrong").textContent=w;$("skipped").textContent=s;$("rank").textContent="आपकी Rank: "+me;$("review").innerHTML=test.questions.map((q,k)=>`<div class="${answers[k]===q.a?"right":"wrong"}"><b>Q${k+1}. ${esc(q.q)}</b><br>विद्यार्थी ने चुना: <b>${answers[k]===null?"कोई उत्तर नहीं":"ABCD"[answers[k]]+". "+esc(q.o[answers[k]])}</b><br>सही उत्तर: <b>${"ABCD"[q.a]}. ${esc(q.o[q.a])}</b><br>${answers[k]===q.a?"✅ सही (+4)":answers[k]===null?"0 अंक":"❌ गलत (−1)"}</div>`).join("")}catch(e){alert("Result save नहीं हुआ: "+e.message)}}async function sendFeedback(){let m=$("feedback").value.trim();if(!m||!lastResultId)return;try{await api("feedback","POST",{result_id:lastResultId,message:m});alert("Feedback भेज दिया गया।")}catch(e){alert("Feedback नहीं भेजा गया: "+e.message)}}function adminLogin(){if(prompt("Owner Code")!==ADMIN_CODE)return alert("गलत Owner Code");show("admin");adminTests()}
async function adminTests(){try{let r=await api("tests");$("adminBody").innerHTML=`<h3>Tests</h3><button class="g" onclick="newTest()">+ नया Test जोड़ें</button>`+(r.length?r.map(t=>`<div class="card"><b>${esc(t.name)}</b> — ${t.published?"Published":"Draft"}<br>${t.questions.length} प्रश्न • ${t.duration} मिनट<br><button class="l" onclick="toggle(${t.id},${!t.published})">${t.published?"Unpublish":"Publish"}</button><button class="d" onclick="deleteTest(${t.id})">Delete</button></div>`).join(""):"<p>अभी कोई Test नहीं है। ऊपर + नया Test जोड़ें दबाएँ।</p>")}catch(e){$("adminBody").innerHTML="Supabase error: "+esc(e.message)}}
function newTest(){let qs=Array.from({length:100},(_,i)=>({q:"",o:["","","",""],a:0}));$("adminBody").innerHTML=`<h3>नया 100 प्रश्न वाला Test</h3><label>Test का नाम</label><input id="tn" placeholder="जैसे AIIMS CRE Mock Test 1"><label>समय (मिनट)</label><input id="td" type="number" value="90" min="1"><p class="small">नीचे 100 प्रश्न भरें। सही उत्तर के सामने A/B/C/D चुनें।</p><div id="qforms"></div><button class="g" onclick="saveTest()">Save Test (Draft)</button><button class="l" onclick="adminTests()">Cancel</button>`;$("qforms").innerHTML=qs.map((q,i)=>`<div class="qedit"><b>प्रश्न ${i+1}</b><textarea id="q${i}" placeholder="प्रश्न लिखें"></textarea><input id="o${i}a" placeholder="A विकल्प"><input id="o${i}b" placeholder="B विकल्प"><input id="o${i}c" placeholder="C विकल्प"><input id="o${i}d" placeholder="D विकल्प"><label>सही उत्तर</label><select id="a${i}"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></div>`).join("")}
async function saveTest(){let name=$("tn").value.trim(),duration=Number($("td").value);if(!name)return alert("Test का नाम लिखें");if(!duration)return alert("समय डालें");let qs=[];for(let i=0;i<100;i++){let q=$("q"+i).value.trim(),o=[$("o"+i+"a").value.trim(),$("o"+i+"b").value.trim(),$("o"+i+"c").value.trim(),$("o"+i+"d").value.trim()],a=Number($("a"+i).value);if(!q||o.some(x=>!x))return alert("प्रश्न "+(i+1)+" पूरा भरें।");qs.push({q,o,a})}try{await api("tests","POST",{name,duration,questions:qs,published:false});alert("Test Draft में save हो गया।");adminTests()}catch(e){alert("Test save नहीं हुआ: "+e.message)}}async function toggle(id,v){try{await api("tests","PATCH",{published:v},"?id=eq."+id);adminTests()}catch(e){alert(e.message)}}async function deleteTest(id){if(!confirm("यह Test और उसके results हट सकते हैं। Delete करना है?"))return;try{await api("tests","DELETE",null,"?id=eq."+id);adminTests()}catch(e){alert(e.message)}}async function adminResults(){try{let r=await api("results");r.sort((a,b)=>b.score-a.score);$("adminBody").innerHTML="<h3>सभी Results / Rank</h3>"+(r.length?"<table><tr><th>Rank</th><th>नाम</th><th>Test ID</th><th>अंक</th><th>सही</th><th>गलत</th></tr>"+r.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.student_name)}</td><td>${x.test_id}</td><td>${x.score}</td><td>${x.correct}</td><td>${x.wrong}</td></tr>`).join("")+"</table>":"अभी कोई Result नहीं है।")}catch(e){$("adminBody").innerHTML="Error: "+esc(e.message)}}async function adminFeedback(){try{let r=await api("feedback");$("adminBody").innerHTML="<h3>Feedback</h3>"+(r.length?r.map(x=>`<div class="card">${esc(x.message)}</div>`).join(""):"अभी कोई Feedback नहीं है।")}catch(e){$("adminBody").innerHTML="Error: "+esc(e.message)}}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}</script></body></html>
