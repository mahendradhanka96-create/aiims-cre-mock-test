<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123b6d">
<link rel="icon" type="image/png" href="./icon-512.png">
<title>AIIMS / RML Hospital Attendant Mock Test</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#eef3f8;color:#172033}
header{background:#123b6d;color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center}
.wrap{max-width:1050px;margin:auto;padding:12px}
.card{background:#fff;padding:16px;border-radius:14px;margin:10px 0;box-shadow:0 2px 12px #0001}
button{border:0;border-radius:8px;padding:10px 14px;margin:4px;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
.p{background:#1769aa;color:#fff}.g{background:#159447;color:#fff}.d{background:#c62828;color:#fff}.l{background:#e8edf3}
input,textarea,select{padding:10px;width:100%;box-sizing:border-box;margin:5px 0;border:1px solid #ccd5df;border-radius:8px}
.hide{display:none}
.opts button{display:block;width:100%;text-align:left;background:#f8fafc;border:2px solid #dbe3ec}
.opts .sel{border-color:#1769aa;background:#e5f2ff}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.qn{background:#e8edf2}.done{background:#b7e6c5}.cur{outline:3px solid #1769aa}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{text-align:center;background:#f3f6f9;padding:12px;border-radius:8px}
.right{background:#e8f7ed;padding:10px;border-radius:8px;margin:8px 0}
.wrong{background:#fff0f0;padding:10px;border-radius:8px;margin:8px 0}
table{width:100%;border-collapse:collapse}
td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}
.qedit{border:1px solid #d8e0e8;border-radius:10px;padding:10px;margin:8px 0}
.qedit h4{margin:0 0 5px}
.importbox{background:#eef7ff;border:2px dashed #1769aa;padding:14px;border-radius:10px}
.sectionBar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.sectionPill{padding:8px 10px;border-radius:8px;background:#e8edf3;font-size:14px}
.sectionPill.active{outline:3px solid #1769aa;font-weight:bold}
.sectionPill.done{background:#b7e6c5}
.lockNote{background:#fff8e1;padding:10px;border-radius:8px;margin:8px 0}
.takenCard{border:2px solid #159447}
.takenTag{display:inline-block;background:#e8f7ed;color:#176b38;padding:6px 10px;border-radius:8px;font-weight:bold;margin:8px 0}
@media(max-width:600px){
.grid{grid-template-columns:repeat(5,1fr)}
.stats{grid-template-columns:repeat(2,1fr)}
.sectionPill{font-size:12px;padding:7px 8px}
}
</style>
</head>
<body>

<header>
  <b>AIIMS / RML Hospital Attendant Mock Test</b>
  <span id="timer">18:00</span>
</header>

<div class="wrap">

<section id="home" class="card">
  <h2>Mock Test App</h2>
  <p>अपना Exam चुनें</p>
  <button class="p" onclick="chooseExam('AIIMS')">AIIMS Hospital Attendant</button>
  <button class="g" onclick="chooseExam('RML')">RML Hospital Attendant</button>
  <br>
  <button class="l" onclick="adminLogin()">Owner / Admin</button>
</section>

<section id="student" class="hide card">
  <h3 id="studentExamTitle">विद्यार्थी की जानकारी</h3>

  <input id="firstName" placeholder="First Name">
  <input id="lastName" placeholder="Last Name">

  <div id="tests"></div>
</section>

<section id="exam" class="hide">

  <div class="card">
    <div class="sectionBar" id="sectionBar"></div>
    <div id="sectionInfo" class="lockNote"></div>

    <b id="num"></b>
    <span id="count" style="float:right"></span>

    <h3 id="question"></h3>
    <div id="options" class="opts"></div>

    <button class="l" id="prevBtn" onclick="prev()">पिछला</button>
    <button class="p" id="nextBtn" onclick="next()">अगला</button>
    <button class="l" onclick="clearAnswer()">उत्तर हटाएँ</button>
    <button class="d" id="submitBtn" onclick="submitTest()">Submit Test</button>
  </div>

  <div class="card">
    <b>इस Section के प्रश्न</b>
    <div id="qgrid" class="grid"></div>
  </div>

</section>

<section id="result" class="hide">
  <div class="card">
    <h2>परिणाम</h2>
    <div class="stats">
      <div class="stat"><b id="score"></b><br>अंक / <span id="totalMarksLabel">400</span></div>
      <div class="stat"><b id="correct"></b><br>सही</div>
      <div class="stat"><b id="wrong"></b><br>गलत</div>
      <div class="stat"><b id="skipped"></b><br>छोड़े</div>
    </div>
    <h3 id="rank"></h3>
    <button class="p" onclick="returnToTestList()">← टेस्ट सूची में वापस जाएँ</button>
  </div>

  <div class="card">
    <h3>आपके दिए उत्तर और सही उत्तर</h3>
    <div id="review"></div>
  </div>

  <div class="card">
    <h3>Feedback / Comment</h3>
    <textarea id="feedback" placeholder="अपनी राय लिखें"></textarea>
    <button class="p" onclick="sendFeedback()">Feedback भेजें</button>
  </div>
</section>

<section id="admin" class="hide">
  <div class="card">
    <h2>Owner / Admin (Local Admin)</h2>
    <button class="p" onclick="adminTests()">Tests</button>
    <button class="l" onclick="adminResults()">सभी Results / Rank</button>
    <button class="l" onclick="adminFeedback()">Feedback</button>
    <button class="l" onclick="adminLogoutLocal()">Logout</button>
  </div>
  <div id="adminBody" class="card"></div>
</section>

</div>

<script>
const SUPABASE_URL="https://dqumlteggtfygpssjtzk.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_Rfvy1drDWb-fXgP37UdEAw_QWg0X_cu";
const ADMIN_CODE="8890";

const EXAM_CONFIGS={
  "AIIMS":{
    title:"AIIMS Hospital Attendant (CRE-5 Group Code 16)",
    sections:5, questionsPerSection:20, sectionSeconds:18*60,
    correctMarks:4, wrongMarks:-1, totalMarks:400,
    pattern:"100 प्रश्न • 90 मिनट • 5 Sections × 20 प्रश्न • सही +4 / गलत −1"
  },
  "RML":{
    title:"RML Hospital Attendant Grade-II",
    sections:1, questionsPerSection:100, sectionSeconds:120*60,
    correctMarks:1, wrongMarks:-0.25, totalMarks:100,
    pattern:"100 प्रश्न • 120 मिनट • सही +1 / गलत −0.25"
  }
};
let selectedExam="AIIMS";
let examConfig=EXAM_CONFIGS.AIIMS;
const TOTAL_QUESTIONS=100;
const LOCAL_TESTS_KEY="aiims_rml_local_tests_v1";
const LOCAL_RESULTS_KEY="aiims_rml_local_results_v1";
const LOCAL_FEEDBACK_KEY="aiims_rml_local_feedback_v1";
const LOCAL_TAKEN_TESTS_KEY="aiims_rml_taken_tests_v1";

let tests=[],test=null,idx=0,answers=[],lastResultId=null;
let adminToken=null,adminEmail="";
let sectionIndex=0,sectionEnd=0,sectionTimerRunning=false,submitted=false;

const $=x=>document.getElementById(x);

function show(x){
  ["home","student","exam","result","admin"].forEach(y=>$(y).classList.add("hide"));
  $(x).classList.remove("hide");
}

function makeConnectionHint(error, url=""){
  const msg=String(error?.message||error||"Unknown error");
  const pageProtocol=window.location?.protocol||"unknown";
  const pageOrigin=window.location?.origin||"unknown";
  if(pageProtocol==="file:"){
    return msg+"\nकारण: ऐप file:// से खुला है। इसे HTTPS वेबसाइट/hosting से खोलें, सीधे computer की file से नहीं।\nCurrent origin: "+pageOrigin;
  }
  if(/Failed to fetch|NetworkError|Load failed/i.test(msg)){
    return msg+"\nकारण: Browser को Supabase से HTTP response नहीं मिला। सम्भावित कारण: internet/DNS, Supabase project/API URL, hosting CORS/origin, या browser extension/network block.\nWebsite origin: "+pageOrigin;
  }
  if(/HTTP 401/.test(msg)) return msg+"\nजाँच: Supabase publishable key और project URL एक ही project के हों।";
  if(/HTTP 403/.test(msg)) return msg+"\nजाँच: RLS/Database permissions के लिए साथ दी गई SQL setup file चलाएँ।";
  if(/HTTP 404/.test(msg)) return msg+"\nजाँच: public.tests या requested API/table मौजूद नहीं है; SQL setup file चलाएँ।";
  if(/HTTP 5\d\d/.test(msg)) return msg+"\nजाँच: Supabase project/service में server-side समस्या हो सकती है।";
  return msg;
}

async function api(table,method="GET",body=null,query=""){
  if(!/^(tests|results|feedback|app_admins)$/.test(table)) throw Error("Invalid API table");
  const url=SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/"+table+query;
  const headers={"apikey":SUPABASE_PUBLISHABLE_KEY,"Accept":"application/json"};
  if(adminToken) headers["Authorization"]="Bearer "+adminToken;
  if(body!==null){
    headers["Content-Type"]="application/json";
    headers["Prefer"]="return=minimal";
  }
  let response;
  try{
    response=await fetch(url,{
      method,
      mode:"cors",
      credentials:"omit",
      cache:"no-store",
      headers,
      body:body!==null?JSON.stringify(body):null
    });
  }catch(error){
    throw Error(makeConnectionHint(error,url));
  }
  const raw=await response.text();
  let data=null;
  if(raw){try{data=JSON.parse(raw)}catch(_){data=raw}}
  if(!response.ok){
    const details=typeof data==="string"?data:JSON.stringify(data);
    throw Error("Supabase HTTP "+response.status+": "+details);
  }
  return data;
}

async function serverAdminLogin(){
  const email=$("serverAdminEmail")?.value.trim();
  const password=$("serverAdminPassword")?.value;
  const status=$("serverAuthStatus");
  if(!email||!password){alert("Supabase Admin Email और Password भरें।");return;}
  if(status)status.textContent="Server Admin login हो रहा है...";
  try{
    let response;
    try{
      response=await fetch(SUPABASE_URL.replace(/\/$/,"")+"/auth/v1/token?grant_type=password",{
        method:"POST",mode:"cors",credentials:"omit",cache:"no-store",
        headers:{"apikey":SUPABASE_PUBLISHABLE_KEY,"Content-Type":"application/json","Accept":"application/json"},
        body:JSON.stringify({email,password})
      });
    }catch(error){throw Error(makeConnectionHint(error,SUPABASE_URL+"/auth/v1/token?grant_type=password"));}
    const raw=await response.text();
    let data={};try{data=raw?JSON.parse(raw):{}}catch(_){data={message:raw}}
    if(!response.ok)throw Error("Supabase Auth HTTP "+response.status+": "+(data.msg||data.message||data.error_description||raw));
    if(!data.access_token||!data.user?.id)throw Error("Supabase ने valid Admin session नहीं लौटाया।");
    adminToken=data.access_token;
    adminEmail=data.user.email||email;
    const rows=await api("app_admins","GET",null,"?select=user_id&user_id=eq."+encodeURIComponent(data.user.id));
    if(!Array.isArray(rows)||!rows.length){adminToken=null;adminEmail="";throw Error("यह Email अभी app_admins में Admin नहीं है। Supabase SQL setup file में YOUR_ADMIN_EMAIL_HERE को इसी email से बदलकर SQL चलाएँ।");}
    if(status)status.textContent="✅ Online Admin login सफल: "+adminEmail;
    alert("Supabase Online Admin Login सफल हो गया। अब Test Server पर Save/Publish होगा।");
    await adminTests();
  }catch(error){
    adminToken=null;adminEmail="";
    const msg=error.message||String(error);
    if(status)status.textContent="❌ "+msg;
    alert("Online Admin Login नहीं हुआ:\n\n"+msg);
  }
}

function serverAdminLogout(){
  adminToken=null;adminEmail="";
  adminTests();
}

function adminLogoutLocal(){
  adminToken=null;adminEmail="";
  show("home");
}

function readLocalTests(){
  try{
    const v=JSON.parse(localStorage.getItem(LOCAL_TESTS_KEY)||"[]");
    return Array.isArray(v)?v:[];
  }catch(e){return []}
}
function writeLocalTests(list){
  localStorage.setItem(LOCAL_TESTS_KEY,JSON.stringify(list));
}
function readLocalResults(){
  try{
    const v=JSON.parse(localStorage.getItem(LOCAL_RESULTS_KEY)||"[]");
    return Array.isArray(v)?v:[];
  }catch(e){return []}
}
function writeLocalResults(list){
  localStorage.setItem(LOCAL_RESULTS_KEY,JSON.stringify(list));
}
function readLocalFeedback(){
  try{
    const v=JSON.parse(localStorage.getItem(LOCAL_FEEDBACK_KEY)||"[]");
    return Array.isArray(v)?v:[];
  }catch(e){return []}
}
function writeLocalFeedback(list){
  localStorage.setItem(LOCAL_FEEDBACK_KEY,JSON.stringify(list));
}
function readTakenTests(){
  try{
    const value=JSON.parse(localStorage.getItem(LOCAL_TAKEN_TESTS_KEY)||"[]");
    return Array.isArray(value)?value:[];
  }catch(error){return []}
}
function takenTestKey(item){
  return String(item?.exam_type||selectedExam)+"::"+String(item?.id??"");
}
function getTakenTest(item){
  const key=takenTestKey(item);
  return readTakenTests().find(row=>row.key===key)||null;
}
function markTestTaken(item,details){
  const records=readTakenTests();
  const key=takenTestKey(item);
  const record={
    key,exam_type:item.exam_type||selectedExam,test_id:String(item.id),
    test_name:String(item.name||"Test"),completed_at:new Date().toISOString(),
    score:details.score,correct:details.correct,wrong:details.wrong,skipped:details.skipped
  };
  const index=records.findIndex(row=>row.key===key);
  if(index>=0)records[index]=record;else records.push(record);
  localStorage.setItem(LOCAL_TAKEN_TESTS_KEY,JSON.stringify(records));
}
function displayDateTime(value){
  try{return new Date(value).toLocaleString("hi-IN");}catch(error){return ""}
}
function isLocalId(id){return String(id).startsWith("LOCAL-")}

async function checkDatabaseConnection(){
  const status=$("dbConnectionStatus");
  if(status)status.textContent="Supabase project, REST API और tests table जाँचे जा रहे हैं...";
  try{
    const rows=await api("tests","GET",null,"?select=id&limit=1");
    const message="✅ Supabase REST connection सफल। tests table accessible है। Rows returned: "+(Array.isArray(rows)?rows.length:"unknown");
    if(status)status.textContent=message;
    alert(message);
  }catch(error){
    const message=error.message||String(error);
    if(status)status.textContent="❌ "+message;
    alert("Supabase connection check असफल:\n\n"+message);
  }
}
function chooseExam(type){
  if(!EXAM_CONFIGS[type])return alert("कृपया AIIMS या RML चुनें।");
  selectedExam=type;
  examConfig=EXAM_CONFIGS[type];
  $("timer").textContent=String(Math.floor(examConfig.sectionSeconds/60)).padStart(2,"0")+":00";
  student();
}

async function loadStudentTests(){
  const localTests=readLocalTests().filter(t=>t.exam_type===selectedExam && t.published!==false);
  let remoteTests=[];
  let serverMessage="";
  try{
    remoteTests=await api("tests","GET",null,
      "?select=id,name,duration,questions,exam_type&published=eq.true&exam_type=eq."+
      encodeURIComponent(selectedExam)+"&order=id.desc");
  }catch(error){serverMessage=error.message||String(error);}
  tests=[...(remoteTests||[]),...localTests];
  const localNote=serverMessage
    ? `<p class="lockNote">⚠️ Online server उपलब्ध नहीं है। Local Save किए गए टेस्ट नीचे दिखाए जा रहे हैं।</p>`
    : "";
  $("tests").innerHTML=localNote+(tests.map(t=>{
    const taken=getTakenTest(t);
    return `
    <div class="card ${taken?"takenCard":""}">
      <b>${esc(t.name)}</b>${t.localOnly?` <span class="sectionPill">इस डिवाइस पर सेव</span>`:""}<br>
      ${taken?`<div class="takenTag">✅ यह टेस्ट आप पहले दे चुके हैं</div><br><small>आखिरी बार दिया: ${esc(displayDateTime(taken.completed_at))}</small><br>`:""}
      ${Array.isArray(t.questions)?t.questions.length:0} प्रश्न<br>
      ${examConfig.pattern}<br>कुल ${examConfig.totalMarks} अंक<br><br>
      <button class="p" onclick="start('${String(t.id).replace(/'/g,"\\'") }')">${taken?"🔁 फिर से Test दें":"▶️ Test शुरू करें"}</button>
    </div>`;
  }).join("")) || localNote+"<p>इस Exam का कोई Published Test नहीं है। Owner/Admin में JSON Import करके Save & Publish करें।</p>";
}
async function student(){
  show("student");
  $("studentExamTitle").textContent=examConfig.title+" — विद्यार्थी की जानकारी";
  if($("totalMarksLabel")) $("totalMarksLabel").textContent=examConfig.totalMarks;
  await loadStudentTests();
}
async function returnToTestList(){
  await student();
}

function start(id){
  const firstName=$("firstName").value.trim();
  const lastName=$("lastName").value.trim();

  if(!firstName) return alert("First Name लिखें");
  if(!lastName) return alert("Last Name लिखें");

  test=tests.find(x=>String(x.id)===String(id));
  if(!test||!Array.isArray(test.questions)||test.questions.length!==TOTAL_QUESTIONS)
    return alert("यह Test 100 प्रश्न वाला सही Test नहीं है।");
  if(String(test.exam_type||"")!==String(selectedExam))
    return alert("यह Test इस Exam का नहीं है।");

  idx=0;
  answers=Array(TOTAL_QUESTIONS).fill(null);
  sectionIndex=0;
  submitted=false;
  lastResultId=null;
  startSectionTimer();
  show("exam");
  draw();
}

function startSectionTimer(){
  sectionEnd=Date.now()+examConfig.sectionSeconds*1000;
  sectionTimerRunning=true;
  updateTimerDisplay();

  setTimeout(tickSectionTimer,250);
}

function tickSectionTimer(){
  if(!sectionTimerRunning || submitted)return;

  const remaining=Math.max(0,Math.ceil((sectionEnd-Date.now())/1000));

  updateTimerDisplay(remaining);

  if(remaining<=0){
    sectionTimerRunning=false;
    moveToNextSectionOrSubmit(true);
    return;
  }

  setTimeout(tickSectionTimer,250);
}

function updateTimerDisplay(seconds){
  const s = seconds===undefined
    ? Math.max(0,Math.ceil((sectionEnd-Date.now())/1000))
    : seconds;

  $("timer").textContent=
    String(Math.floor(s/60)).padStart(2,"0")+":"+
    String(s%60).padStart(2,"0");
}

function sectionStart(){
  return sectionIndex*examConfig.questionsPerSection;
}
function sectionEndIndex(){
  return sectionStart()+examConfig.questionsPerSection-1;
}
function sectionName(i){
  return String.fromCharCode(65+i);
}

function draw(){
  if(!test)return;
  const start=sectionStart();
  const end=sectionEndIndex();
  const q=test.questions[idx];

  $("num").textContent=`प्रश्न ${idx+1}/${TOTAL_QUESTIONS} • Section ${sectionName(sectionIndex)}`;
  $("count").textContent=`इस Section में उत्तर दिए: ${answers.slice(start,end+1).filter(x=>x!==null).length}/${examConfig.questionsPerSection}`;
  $("question").textContent=q.q;

  $("options").innerHTML=q.o.map((v,j)=>`
    <button class="${answers[idx]===j?"sel":""}" onclick="selectAnswer(${j})">
      ${"ABCD"[j]}. ${esc(v)}
    </button>
  `).join("");

  $("qgrid").innerHTML=Array.from(
    {length:examConfig.questionsPerSection},
    (_,k)=>{
      const gi=start+k;
      return `<button class="qn ${answers[gi]!==null?"done ":""} ${gi===idx?"cur":""}" onclick="jumpQuestion(${gi})">${gi+1}</button>`;
    }
  ).join("");

  $("prevBtn").disabled=idx<=start;
  $("nextBtn").disabled=idx>=end;
  $("submitBtn").disabled=sectionIndex!==examConfig.sections-1;

  $("sectionInfo").textContent=
    sectionIndex<examConfig.sections-1
    ? `Section ${sectionName(sectionIndex)}: प्रश्न ${start+1}–${end+1}. समय पूरा होने पर Section ${sectionName(sectionIndex+1)} अपने-आप खुलेगा। पिछला Section दोबारा नहीं खोला जा सकेगा।`
    : `Section ${sectionName(sectionIndex)}: प्रश्न ${start+1}–${end+1}. यह आखिरी Section है। समय पूरा होने पर Test अपने-आप Submit होगा।`;

  renderSectionBar();
}

function renderSectionBar(){
  $("sectionBar").innerHTML=Array.from({length:examConfig.sections},(_,i)=>{
    let cls="sectionPill";
    if(i===sectionIndex)cls+=" active";
    if(i<sectionIndex)cls+=" done";
    return `<span class="${cls}">Section ${sectionName(i)} ${i<sectionIndex?"✓":""}</span>`;
  }).join("");
}

function selectAnswer(j){
  if(idx<sectionStart() || idx>sectionEndIndex())return;
  answers[idx]=j;
  draw();
}

function jumpQuestion(globalIndex){
  if(globalIndex<sectionStart() || globalIndex>sectionEndIndex())return;
  idx=globalIndex;
  draw();
}

function next(){
  const end=sectionEndIndex();
  if(idx<end){
    idx++;
    draw();
  }
}

function prev(){
  const start=sectionStart();
  if(idx>start){
    idx--;
    draw();
  }
}

function clearAnswer(){
  answers[idx]=null;
  draw();
}

function moveToNextSectionOrSubmit(auto=true){
  if(sectionIndex<examConfig.sections-1){
    sectionIndex++;
    idx=sectionStart();
    startSectionTimer();
    draw();
    if(auto){
      alert(`Section ${sectionName(sectionIndex-1)} का समय पूरा हो गया। अब Section ${sectionName(sectionIndex)} शुरू हो गया है। पिछला Section लॉक है।`);
    }
  }else{
    submitTest(true);
  }
}

function formatScore(v){
  const n=Number(v);
  return Number.isInteger(n)?String(n):n.toFixed(2);
}

async function submitTest(auto=false){
  if(submitted)return;
  if(sectionIndex!==examConfig.sections-1)return alert("आखिरी Section पूरा होने के बाद ही Test Submit होगा।");
  if(!auto&&!confirm("क्या पूरा Test Submit करना है?"))return;
  submitted=true;sectionTimerRunning=false;
  let correctCount=0,wrongCount=0,skippedCount=0;
  answers.forEach((value,index)=>{
    if(value===null)skippedCount++;
    else if(value===test.questions[index].a)correctCount++;
    else wrongCount++;
  });
  const score=Number((correctCount*examConfig.correctMarks+wrongCount*examConfig.wrongMarks).toFixed(2));
  const reviewData=test.questions.map((q,index)=>({user:answers[index],correctIndex:q.a,correct:answers[index]===q.a}));
  const studentName=($("firstName").value.trim()+" "+$("lastName").value.trim()).trim();
  const payload={
    test_id:Number(test.id),exam_type:selectedExam,student_name:studentName,
    score,correct:correctCount,wrong:wrongCount,skipped:skippedCount,
    answers:answers,review:reviewData
  };
  let serverSaved=false,localSaved=false,serverError=null,rank=0;
  if(!test.localOnly){
    try{
      await api("results","POST",payload);
      serverSaved=true;
    }catch(error){serverError=error;}
  }else{
    serverError=Error("यह टेस्ट केवल इस डिवाइस में सेव है।");
  }
  if(!serverSaved){
    try{
      const local=readLocalResults();
      const localId="LOCAL-RESULT-"+Date.now()+"-"+Math.floor(Math.random()*10000);
      local.push({...payload,test_id:test.id,id:localId,localOnly:true,created_at:new Date().toISOString()});
      writeLocalResults(local);lastResultId=localId;localSaved=true;
      const same=local.filter(row=>String(row.test_id)===String(test.id)&&row.exam_type===selectedExam)
        .sort((a,b)=>Number(b.score)-Number(a.score));
      rank=same.findIndex(row=>row.id===localId)+1;
    }catch(storageError){
      submitted=false;
      alert("Result save नहीं हो पाया। Server error: "+(serverError?.message||serverError)+"\nLocal storage error: "+(storageError.message||storageError));
      return;
    }
  }
  try{
    markTestTaken(test,{score,correct:correctCount,wrong:wrongCount,skipped:skippedCount});
  }catch(takenError){
    console.warn("Test completion mark could not be saved:",takenError);
  }
  show("result");
  if($("totalMarksLabel"))$("totalMarksLabel").textContent=examConfig.totalMarks;
  $("score").textContent=formatScore(score);
  $("correct").textContent=correctCount;$("wrong").textContent=wrongCount;$("skipped").textContent=skippedCount;
  $("rank").textContent=serverSaved
    ? "✅ Result Online Server पर जमा हो गया। पूरी Rank Owner/Admin के Results में दिखाई देगी।"
    : "इस डिवाइस की Local Rank: "+rank;
  $("review").innerHTML=
    `<p><b>${esc(examConfig.title)}</b> • कुल ${examConfig.totalMarks} अंक</p>`+
    test.questions.map((q,index)=>`<div class="${answers[index]===q.a?"right":"wrong"}">
      <b>Q${index+1}. ${esc(q.q)}</b><br>
      विद्यार्थी ने चुना: <b>${answers[index]===null?"कोई उत्तर नहीं":"ABCD"[answers[index]]+". "+esc(q.o[answers[index]])}</b><br>
      सही उत्तर: <b>${"ABCD"[q.a]}. ${esc(q.o[q.a])}</b><br>
      ${answers[index]===q.a?`✅ सही (+${examConfig.correctMarks})`:answers[index]===null?"0 अंक":`❌ गलत (${examConfig.wrongMarks})`}
    </div>`).join("");
  if(localSaved)alert("यह Result केवल इसी ब्राउज़र में सेव हुआ है। Online Result के लिए Supabase connection और SQL setup सफल होना चाहिए।\n\nServer: "+(serverError?.message||"Local test"));
}

function normalizeImportedQuestions(list){
  if(!Array.isArray(list)) throw Error("questions array नहीं मिला");
  return list.map((q,i)=>{
    const question=q.q??q.question??"";
    const options=q.o??q.options??[];
    let a=q.a;
    if(a==null) a=q.correctAnswer;
    if(typeof a==="string"){
      const s=a.trim().toUpperCase();
      if(/^[ABCD]$/.test(s)) a=s.charCodeAt(0)-65;
      else if(/^\d+$/.test(s)) a=Number(s);
    }
    a=Number(a);
    if(!question||!Array.isArray(options)||options.length!==4||![0,1,2,3].includes(a))
      throw Error("प्रश्न "+(i+1)+" का format गलत है");
    return {q:String(question),o:options.map(String),a};
  });
}

function importExamJSON(ev, examType){
  const f=ev.target.files && ev.target.files[0];
  if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      if(!EXAM_CONFIGS[examType])throw Error("अमान्य Exam चुना गया है");
      const data=JSON.parse(reader.result);
      const questions=normalizeImportedQuestions(data.questions);
      if(questions.length!==100)throw Error("JSON फाइल में ठीक 100 प्रश्न होने चाहिए");

      newTest(examType);
      $("tname").value=data.name||data.test_name||(
        EXAM_CONFIGS[examType].title+" - Test 1"
      );
      renderBuilder(questions);
      $("importStatus").textContent=" ✅ "+EXAM_CONFIGS[examType].title+" के 100 प्रश्न Import हो गए। अब Save Draft या Save & Publish दबाएँ।";
    }catch(e){
      alert(EXAM_CONFIGS[examType]?.title+" JSON Import नहीं हुआ: "+e.message);
    }finally{
      ev.target.value="";
    }
  };
  reader.onerror=()=>alert("JSON फाइल पढ़ी नहीं जा सकी।");
  reader.readAsText(f,"UTF-8");
}

function collectBuilder(){
  const qs=[];

  for(let i=0;i<100;i++){
    const q=$("q"+i).value.trim();

    const o=[
      $("o"+i+"a").value.trim(),
      $("o"+i+"b").value.trim(),
      $("o"+i+"c").value.trim(),
      $("o"+i+"d").value.trim()
    ];

    const a=Number($("a"+i).value);

    if(!q||o.some(x=>!x))
      throw Error("प्रश्न "+(i+1)+" अधूरा है");

    qs.push({q,o,a});
  }

  return qs;
}

async function saveBuilder(publish){
  try{
    const questions=collectBuilder();
    const type=$("examType").value;
    const config=EXAM_CONFIGS[type];
    if(!config)throw Error("कृपया AIIMS या RML Exam चुनें।");
    const name=$("tname").value.trim()||(config.title+" - Test 1");
    const duration=config.sections*config.sectionSeconds/60;
    if(questions.length!==100)throw Error("Test में 100 प्रश्न होने चाहिए।");
    const payload={name,duration,questions,published:!!publish,exam_type:type};
    let onlineSaved=false,serverError=null;
    if(adminToken){
      try{await api("tests","POST",payload);onlineSaved=true;}
      catch(error){serverError=error;}
    }else{
      serverError=Error("Online Server Admin Login नहीं किया गया।");
    }
    if(onlineSaved){
      alert(publish?"Test Supabase Server पर Save & Publish हो गया।":"Test Supabase Server पर Draft में Save हो गया।");
    }else{
      const local=readLocalTests();
      const localId="LOCAL-TEST-"+Date.now()+"-"+Math.floor(Math.random()*10000);
      local.push({...payload,id:localId,localOnly:true,created_at:new Date().toISOString()});
      writeLocalTests(local);
      alert("Test इस Browser में Local Save हो गया है।\n\nOnline Server पर Save नहीं हुआ।\nकारण: "+(serverError?.message||serverError)+"\n\nदूसरे लोगों को दिखाने के लिए Supabase Admin Login और connection ठीक होना जरूरी है।");
    }
    await adminTests();
  }catch(error){
    console.error("SAVE TEST ERROR:",error);
    alert("Test save नहीं हुआ: "+(error.message||String(error)));
  }
}

    const local=readLocalResults().filter(row=>!filterExam||row.exam_type===filterExam).sort((a,b)=>Number(b.score)-Number(a.score));
    $("adminBody").innerHTML="<h3>Local Results / Rank</h3><p>Online Results नहीं खुल सके।</p>"+
      local.map((row,index)=>`<div class="card"><b>Rank ${index+1} — ${esc(row.student_name)}</b><br>${esc(EXAM_CONFIGS[row.exam_type]?.title||row.exam_type)}<br>Score ${formatScore(row.score)} • सही ${row.correct} • गलत ${row.wrong} • छोड़े ${row.skipped}</div>`).join("")+
      `<p class="lockNote">Server error: ${esc(error.message||error)}</p>`;
  }
}
async function adminViewResult(resultId){
  try{
    const rows=await api("results","GET",null,"?select=id,test_id,exam_type,student_name,score,correct,wrong,skipped,answers,review,created_at&id=eq."+encodeURIComponent(resultId));
    if(!rows[0]) throw Error("Result नहीं मिला");
    const r=rows[0];
    const ts=await api("tests","GET",null,"?select=id,name,questions&id=eq."+encodeURIComponent(r.test_id));
    const t=ts[0];
    const qs=Array.isArray(t?.questions)?t.questions:[];
    const ans=Array.isArray(r.answers)?r.answers:[];
    const review=Array.isArray(r.review)?r.review:[];

    let html=`<button class="l" onclick="adminResults('${esc(r.exam_type||"AIIMS")}')">← वापस</button>
      <h3>${esc(r.exam_type||"AIIMS")} — ${esc(t?.name||("Test "+r.test_id))}</h3>
      <p><b>नाम:</b> ${esc(r.student_name)}<br><b>Score:</b> ${formatScore(r.score)} • सही ${r.correct} • गलत ${r.wrong} • छोड़े ${r.skipped}</p>`;
    html+=qs.map((q,k)=>{
      const user=ans[k]; const correct=review[k]?.correctIndex??q.a;
      const cls=user===correct?"right":(user==null?"card":"wrong");
      return `<div class="${cls}"><b>Q${k+1}. ${esc(q.q)}</b><br>विद्यार्थी: <b>${user==null?"कोई उत्तर नहीं":("ABCD"[user]+". "+esc(q.o[user]))}</b><br>सही: <b>${"ABCD"[correct]}. ${esc(q.o[correct])}</b></div>`;
    }).join("");
    $("adminBody").innerHTML=html;
  }catch(e){ alert("Result details नहीं खुल रहे: "+(e?.message||e)); }
}

async function adminFeedback(){
  if(!adminToken){
    const local=readLocalFeedback();
    $("adminBody").innerHTML="<h3>Local Feedback</h3><p>Online Feedback देखने के लिए Supabase Admin Login करें।</p>"+
      (local.map(row=>`<div class="card">${esc(row.message)}</div>`).join("")||"<p>कोई Local Feedback नहीं है।</p>");
    return;
  }
  try{
    const rows=await api("feedback","GET",null,"?select=id,test_id,exam_type,message,created_at&order=id.desc");
    $("adminBody").innerHTML="<h3>Online Feedback</h3>"+
      (rows.map(row=>`<div class="card"><b>${esc(EXAM_CONFIGS[row.exam_type]?.title||row.exam_type||"")}</b><br>${esc(row.message)}<br><small>${esc(row.created_at||"")}</small></div>`).join("")||"<p>अभी कोई Online Feedback नहीं है।</p>");
  }catch(error){
    $("adminBody").innerHTML=`<h3>Feedback</h3><p>Online Feedback नहीं खुला।</p><p class="lockNote">${esc(error.message||error)}</p>`;
  }
}
function esc(s){
  return String(s??"").replace(
    /[&<>"']/g,
    c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );
}

function attr(s){
  return esc(s);
}
