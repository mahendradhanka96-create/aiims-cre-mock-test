<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123b6d">
<title>AIIMS CRE Mock Test</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#eef3f8;color:#172033}
header{background:#123b6d;color:#fff;padding:14px;display:flex;justify-content:space-between}
.wrap{max-width:1050px;margin:auto;padding:12px}.card{background:#fff;padding:16px;border-radius:14px;margin:10px 0;box-shadow:0 2px 12px #0001}
button{border:0;border-radius:8px;padding:10px 14px;margin:4px;cursor:pointer}.p{background:#1769aa;color:#fff}.g{background:#159447;color:#fff}.d{background:#c62828;color:#fff}.l{background:#e8edf3}
input,textarea,select{padding:10px;width:100%;box-sizing:border-box;margin:5px 0;border:1px solid #ccd5df;border-radius:8px}
.hide{display:none}.opts button{display:block;width:100%;text-align:left;background:#f8fafc;border:2px solid #dbe3ec}.opts .sel{border-color:#1769aa;background:#e5f2ff}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}.qn{background:#e8edf2}.done{background:#b7e6c5}.cur{outline:3px solid #1769aa}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{text-align:center;background:#f3f6f9;padding:12px;border-radius:8px}
.right{background:#e8f7ed;padding:10px;border-radius:8px}.wrong{background:#fff0f0;padding:10px;border-radius:8px}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}
.qedit{border:1px solid #d8e0e8;border-radius:10px;padding:10px;margin:8px 0}.qedit h4{margin:0 0 5px}
.importbox{background:#eef7ff;border:2px dashed #1769aa;padding:14px;border-radius:10px}
@media(max-width:600px){.grid{grid-template-columns:repeat(5,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><b>AIIMS CRE Mock Test</b><span id="timer">90:00</span></header>
<div class="wrap">

<section id="home" class="card">
<h2>AIIMS CRE Mock Test</h2>
<p>100 प्रश्न • 90 मिनट • सही +4 • गलत −1 • छोड़ा 0</p>
<button class="p" onclick="student()">विद्यार्थी Test</button>
<button class="g" onclick="adminLogin()">Owner / Admin</button>
</section>

<section id="student" class="hide card">
<h3>विद्यार्थी का नाम</h3><input id="name" placeholder="नाम">
<div id="tests"></div>
</section>

<section id="exam" class="hide">
<div class="card"><b id="num"></b><span id="count" style="float:right"></span>
<h3 id="question"></h3><div id="options" class="opts"></div>
<button class="l" onclick="prev()">पिछला</button><button class="p" onclick="next()">अगला</button>
<button class="l" onclick="clearAnswer()">उत्तर हटाएँ</button><button class="d" onclick="submitTest()">Submit Test</button>
</div>
<div class="card"><b>प्रश्न सूची</b><div id="qgrid" class="grid"></div></div>
</section>

<section id="result" class="hide">
<div class="card"><h2>परिणाम</h2><div class="stats">
<div class="stat"><b id="score"></b><br>अंक / 400</div>
<div class="stat"><b id="correct"></b><br>सही</div>
<div class="stat"><b id="wrong"></b><br>गलत</div>
<div class="stat"><b id="skipped"></b><br>छोड़े</div>
</div><h3 id="rank"></h3></div>
<div class="card"><h3>आपके दिए उत्तर और सही उत्तर</h3><div id="review"></div></div>
<div class="card"><h3>Feedback / Comment</h3><textarea id="feedback" placeholder="अपनी राय लिखें"></textarea><button class="p" onclick="sendFeedback()">Feedback भेजें</button></div>
</section>

<section id="admin" class="hide">
<div class="card"><h2>Owner / Admin</h2>
<button class="p" onclick="adminTests()">Tests</button>
<button class="l" onclick="adminResults()">सभी Results / Rank</button>
<button class="l" onclick="adminFeedback()">Feedback</button>
<button class="l" onclick="show('home')">Logout</button>
</div>
<div id="adminBody" class="card"></div>
</section>

</div>

<script>
const SUPABASE_URL="https://dqumlteggtfygpssjtzk.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_Rfvy1drDWb-fXgP37UdEAw_QWg0X_cu";
const ADMIN_CODE="8890";

let tests=[],test=null,idx=0,answers=[],end=0,lastResultId=null;
const $=x=>document.getElementById(x);
const show=x=>{["home","student","exam","result","admin"].forEach(y=>$(y).classList.add("hide"));$(x).classList.remove("hide")};

async function api(t,m="GET",b=null,q=""){
 let h={"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY,"Content-Type":"application/json","Prefer":"return=representation"};
 let r=await fetch(SUPABASE_URL+"/rest/v1/"+t+q,{method:m,headers:h,body:b?JSON.stringify(b):null});
 if(!r.ok)throw Error(await r.text());
 return r.status===204?null:r.json()
}

async function student(){
 show("student");
 try{
  tests=await api("tests","GET",null,"?select=id,name,duration,questions&published=eq.true&order=id.desc");
  $("tests").innerHTML=tests.map(t=>`<div class="card"><b>${esc(t.name)}</b><br>${t.duration} मिनट • ${t.questions.length} प्रश्न<br><button class="p" onclick="start(${t.id})">Test शुरू करें</button></div>`).join("")||"<p>अभी कोई Published Test नहीं है।</p>";
 }catch(e){alert("Supabase setup/RLS जाँचें।")}
}

function start(id){
 let n=$("name").value.trim();if(!n)return alert("नाम लिखें");
 test=tests.find(x=>x.id===id);idx=0;answers=Array(test.questions.length).fill(null);
 end=Date.now()+test.duration*60000;show("exam");draw();clock()
}
function clock(){
 let s=Math.max(0,Math.ceil((end-Date.now())/1000));
 $("timer").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
 if(s===0){submitTest(true);return}setTimeout(clock,500)
}
function draw(){
 let q=test.questions[idx];
 $("num").textContent=`प्रश्न ${idx+1}/${test.questions.length}`;
 $("count").textContent=`उत्तर दिए: ${answers.filter(x=>x!==null).length}`;
 $("question").textContent=q.q;
 $("options").innerHTML=q.o.map((v,j)=>`<button class="${answers[idx]===j?"sel":""}" onclick="answers[idx]=${j};draw()">${"ABCD"[j]}. ${esc(v)}</button>`).join("");
 $("qgrid").innerHTML=Array.from({length:test.questions.length},(_,k)=>`<button class="qn ${answers[k]!==null?"done ":""} ${k===idx?"cur":""}" onclick="idx=${k};draw()">${k+1}</button>`).join("")
}
function next(){if(idx<test.questions.length-1){idx++;draw()}}
function prev(){if(idx>0){idx--;draw()}}
function clearAnswer(){answers[idx]=null;draw()}

async function submitTest(auto=false){
 if(!auto&&!confirm("क्या Test Submit करना है?"))return;
 let c=0,w=0,s=0;
 answers.forEach((v,k)=>v===null?s++:v===test.questions[k].a?c++:w++);
 let score=c*4-w;
 let reviewData=test.questions.map((q,k)=>({user:answers[k],correctIndex:q.a,correct:answers[k]===q.a}));
 try{
  let rows=await api("results","POST",{test_id:test.id,student_name:$("name").value,score,correct:c,wrong:w,skipped:s,answers,review:reviewData});
  lastResultId=rows[0].id;
  let ranks=await api("results","GET",null,"?select=id,score&test_id=eq."+test.id+"&order=score.desc,id.asc");
  let me=ranks.findIndex(x=>x.id===lastResultId)+1;
  show("result");
  $("score").textContent=score;$("correct").textContent=c;$("wrong").textContent=w;$("skipped").textContent=s;
  $("rank").textContent="आपकी Rank: "+me;
  $("review").innerHTML=test.questions.map((q,k)=>`<div class="${answers[k]===q.a?"right":"wrong"}"><b>Q${k+1}. ${esc(q.q)}</b><br>विद्यार्थी ने चुना: <b>${answers[k]===null?"कोई उत्तर नहीं":"ABCD"[answers[k]]+". "+esc(q.o[answers[k]])}</b><br>सही उत्तर: <b>${"ABCD"[q.a]}. ${esc(q.o[q.a])}</b><br>${answers[k]===q.a?"✅ सही (+4)":answers[k]===null?"0 अंक":"❌ गलत (−1)"}</div>`).join("")
 }catch(e){console.error(e);alert("Result save नहीं हुआ। Supabase setup/RLS जाँचें।")}
}

async function sendFeedback(){
 let m=$("feedback").value.trim();if(!m||!lastResultId)return;
 try{await api("feedback","POST",{result_id:lastResultId,message:m});$("feedback").value="";alert("Feedback भेज दिया गया।")}
 catch(e){alert("Feedback save नहीं हुआ।")}
}

function adminLogin(){
 if(prompt("Owner Code")!==ADMIN_CODE)return alert("गलत Owner Code");
 show("admin");adminTests()
}

async function adminTests(){
 try{
  let r=await api("tests");
  $("adminBody").innerHTML=`<h3>Tests</h3>
  <button class="p" onclick="newTest()">+ नया Test जोड़ें</button>
  <button class="g" onclick="document.getElementById('jsonFile').click()">📥 Bulk Import JSON</button>
  <input id="jsonFile" type="file" accept=".json,application/json" class="hide" onchange="importJSON(event)">
  <div id="testList">${r.map(t=>`<div class="card"><b>${esc(t.name)}</b> — ${t.published?"Published":"Draft"}<br>
  ${t.questions?.length||0} प्रश्न • ${t.duration} मिनट<br>
  <button class="l" onclick="toggle(${t.id},${!t.published})">${t.published?"Unpublish":"Publish"}</button>
  <button class="d" onclick="deleteTest(${t.id})">Delete</button></div>`).join("")}</div>`;
 }catch(e){$("adminBody").innerHTML="Supabase setup/RLS पूरा करें।"}
}

function newTest(){
 $("adminBody").innerHTML=`<h3>नया 100 प्रश्न वाला Test</h3>
 <label>Test का नाम</label><input id="tname" value="AIIMS CRE-5 Mock Test 1">
 <label>समय (मिनट)</label><input id="tdur" type="number" value="90">
 <div class="importbox"><b>📥 Bulk Import</b><p>मेरी दी हुई JSON फ़ाइल चुनें। इससे 100 प्रश्न अपने-आप भरेंगे।</p>
 <button class="g" onclick="document.getElementById('newJsonFile').click()">JSON फ़ाइल चुनें</button>
 <input id="newJsonFile" type="file" accept=".json,application/json" class="hide" onchange="importIntoBuilder(event)">
 <span id="importStatus"></span></div>
 <div id="builder"></div>
 <button class="p" onclick="saveBuilder(false)">Save Draft</button>
 <button class="g" onclick="saveBuilder(true)">Save & Publish</button>
 <button class="l" onclick="adminTests()">वापस</button>`;
 renderBuilder(Array.from({length:100},()=>({q:"",o:["","","",""],a:0})));
}

function renderBuilder(qs){
 let b=$("builder");
 b.innerHTML=`<p><b>${qs.length} प्रश्न तैयार हैं।</b> सही उत्तर चुनें।</p>`+
 qs.map((q,i)=>`<div class="qedit"><h4>प्रश्न ${i+1}</h4>
 <input id="q${i}" placeholder="प्रश्न लिखें" value="${attr(q.q)}">
 <input id="o${i}a" placeholder="A विकल्प" value="${attr(q.o[0]||"")}">
 <input id="o${i}b" placeholder="B विकल्प" value="${attr(q.o[1]||"")}">
 <input id="o${i}c" placeholder="C विकल्प" value="${attr(q.o[2]||"")}">
 <input id="o${i}d" placeholder="D विकल्प" value="${attr(q.o[3]||"")}">
 <label>सही उत्तर:</label><select id="a${i}"><option value="0" ${q.a===0?"selected":""}>A</option><option value="1" ${q.a===1?"selected":""}>B</option><option value="2" ${q.a===2?"selected":""}>C</option><option value="3" ${q.a===3?"selected":""}>D</option></select>
 </div>`).join("");
}

function importIntoBuilder(ev){
 let f=ev.target.files[0];if(!f)return;
 let r=new FileReader();
 r.onload=()=>{
  try{
   let d=JSON.parse(r.result);
   if(!d.questions||d.questions.length!==100)throw Error("फ़ाइल में 100 प्रश्न नहीं हैं");
   $("tname").value=d.name||"AIIMS CRE-5 Mock Test 1";
   $("tdur").value=d.duration||90;
   renderBuilder(d.questions);
   $("importStatus").textContent=" ✅ 100 प्रश्न Import हो गए";
  }catch(e){alert("JSON फ़ाइल सही नहीं है: "+e.message)}
 };
 r.readAsText(f)
}

function importJSON(ev){
 let f=ev.target.files[0];if(!f)return;
 let r=new FileReader();r.onload=()=>{
  try{
   let d=JSON.parse(r.result);
   if(!d.questions||d.questions.length!==100)throw Error("100 प्रश्न आवश्यक हैं");
   newTest();
   setTimeout(()=>{
    $("tname").value=d.name||"AIIMS CRE-5 Mock Test 1";$("tdur").value=d.duration||90;
    renderBuilder(d.questions);$("importStatus").textContent=" ✅ 100 प्रश्न Import हो गए";
   },50);
  }catch(e){alert("Import नहीं हुआ: "+e.message)}
 };r.readAsText(f)
}

function collectBuilder(){
 let qs=[];
 for(let i=0;i<100;i++){
  let q=$("q"+i).value.trim(),o=[$("o"+i+"a").value.trim(),$("o"+i+"b").value.trim(),$("o"+i+"c").value.trim(),$("o"+i+"d").value.trim()],a=Number($("a"+i).value);
  if(!q||o.some(x=>!x))throw Error("प्रश्न "+(i+1)+" अधूरा है");
  qs.push({q,o,a});
 }
 return qs
}
async function saveBuilder(publish){
 try{
  let qs=collectBuilder(),name=$("tname").value.trim()||"AIIMS CRE Mock Test",duration=Number($("tdur").value)||90;
  await api("tests","POST",{name,duration,questions:qs,published:publish});
  alert(publish?"Test Publish हो गया।":"Test Draft में Save हो गया।");adminTests()
 }catch(e){console.error(e);alert("Save नहीं हुआ: "+e.message)}
}
async function toggle(id,v){try{await api("tests","PATCH",{published:v},"?id=eq."+id);adminTests()}catch(e){alert("Publish बदल नहीं पाया।")}}
async function deleteTest(id){if(!confirm("क्या यह Test हटाना है?"))return;try{await api("tests","DELETE",null,"?id=eq."+id);adminTests()}catch(e){alert("Delete नहीं हुआ।")}}

async function adminResults(){
 try{
  let r=await api("results");r.sort((a,b)=>b.score-a.score||a.id-b.id);
  $("adminBody").innerHTML="<h3>सभी Results / Rank</h3><table><tr><th>Rank</th><th>नाम</th><th>Test</th><th>अंक</th><th>सही</th><th>गलत</th></tr>"+r.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.student_name)}</td><td>${x.test_id}</td><td>${x.score}</td><td>${x.correct}</td><td>${x.wrong}</td></tr>`).join("")+"</table>"
 }catch(e){alert("Results नहीं आ रहे।")}
}
async function adminFeedback(){
 try{let r=await api("feedback");$("adminBody").innerHTML="<h3>Feedback</h3>"+r.map(x=>`<div class="card">${esc(x.message)}</div>`).join("")}
 catch(e){alert("Feedback नहीं आ रहा।")}
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function attr(s){return esc(s)}
</script>
</body>
</html>
