<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123b6d">
<link rel="icon" type="image/png" href="./icon-512.png">
<title>AIIMS / RML Hospital Attendant Mock Test</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#eef3f8;color:#172033}
header{background:#123b6d;color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center}
.wrap{max-width:1050px;margin:auto;padding:12px}
.card{background:#fff;padding:16px;border-radius:14px;margin:10px 0;box-shadow:0 2px 12px #0001}
button{border:0;border-radius:8px;padding:10px 14px;margin:4px;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
.p{background:#1769aa;color:#fff}.g{background:#159447;color:#fff}.d{background:#c62828;color:#fff}.l{background:#e8edf3}
input,textarea,select{padding:10px;width:100%;box-sizing:border-box;margin:5px 0;border:1px solid #ccd5df;border-radius:8px}
.hide{display:none}
.opts button{display:block;width:100%;text-align:left;background:#f8fafc;border:2px solid #dbe3ec}
.opts .sel{border-color:#1769aa;background:#e5f2ff}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.qn{background:#e8edf2}.done{background:#b7e6c5}.cur{outline:3px solid #1769aa}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{text-align:center;background:#f3f6f9;padding:12px;border-radius:8px}
.right{background:#e8f7ed;padding:10px;border-radius:8px;margin:8px 0}
.wrong{background:#fff0f0;padding:10px;border-radius:8px;margin:8px 0}
table{width:100%;border-collapse:collapse}
td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}
.qedit{border:1px solid #d8e0e8;border-radius:10px;padding:10px;margin:8px 0}
.qedit h4{margin:0 0 5px}
.importbox{background:#eef7ff;border:2px dashed #1769aa;padding:14px;border-radius:10px}
.sectionBar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.sectionPill{padding:8px 10px;border-radius:8px;background:#e8edf3;font-size:14px}
.sectionPill.active{outline:3px solid #1769aa;font-weight:bold}
.sectionPill.done{background:#b7e6c5}
.lockNote{background:#fff8e1;padding:10px;border-radius:8px;margin:8px 0}
@media(max-width:600px){
.grid{grid-template-columns:repeat(5,1fr)}
.stats{grid-template-columns:repeat(2,1fr)}
.sectionPill{font-size:12px;padding:7px 8px}
}
</style>
</head>
<body>

<header>
  <b>AIIMS / RML Hospital Attendant Mock Test</b>
  <span id="timer">18:00</span>
</header>

<div class="wrap">

<section id="home" class="card">
  <h2>Mock Test App</h2>
  <p>अपना Exam चुनें</p>
  <button class="p" onclick="chooseExam('AIIMS')">AIIMS Hospital Attendant</button>
  <button class="g" onclick="chooseExam('RML')">RML Hospital Attendant</button>
  <br>
  <button class="l" onclick="adminLogin()">Owner / Admin</button>
</section>

<section id="student" class="hide card">
  <h3 id="studentExamTitle">विद्यार्थी की जानकारी</h3>

  <input id="mobile" type="tel" maxlength="10" inputmode="numeric" placeholder="Mobile Number" oninput="loadStudentTests()">
  <input id="firstName" placeholder="First Name">
  <input id="lastName" placeholder="Last Name">

  <div id="tests"></div>
</section>

<section id="exam" class="hide">

  <div class="card">
    <div class="sectionBar" id="sectionBar"></div>
    <div id="sectionInfo" class="lockNote"></div>

    <b id="num"></b>
    <span id="count" style="float:right"></span>

    <h3 id="question"></h3>
    <div id="options" class="opts"></div>

    <button class="l" id="prevBtn" onclick="prev()">पिछला</button>
    <button class="p" id="nextBtn" onclick="next()">अगला</button>
    <button class="l" onclick="clearAnswer()">उत्तर हटाएँ</button>
    <button class="d" id="submitBtn" onclick="submitTest()">Submit Test</button>
  </div>

  <div class="card">
    <b>इस Section के प्रश्न</b>
    <div id="qgrid" class="grid"></div>
  </div>

</section>

<section id="result" class="hide">
  <div class="card">
    <h2>परिणाम</h2>
    <div class="stats">
      <div class="stat"><b id="score"></b><br>अंक / <span id="totalMarksLabel">400</span></div>
      <div class="stat"><b id="correct"></b><br>सही</div>
      <div class="stat"><b id="wrong"></b><br>गलत</div>
      <div class="stat"><b id="skipped"></b><br>छोड़े</div>
    </div>
    <h3 id="rank"></h3>
  </div>

  <div class="card">
    <h3>आपके दिए उत्तर और सही उत्तर</h3>
    <div id="review"></div>
  </div>

  <div class="card">
    <h3>Feedback / Comment</h3>
    <textarea id="feedback" placeholder="अपनी राय लिखें"></textarea>
    <button class="p" onclick="sendFeedback()">Feedback भेजें</button>
  </div>
</section>

<section id="admin" class="hide">
  <div class="card">
    <h2>Owner / Admin</h2>
    <button class="p" onclick="adminTests()">Tests</button>
    <button class="l" onclick="adminResults()">सभी Results / Rank</button>
    <button class="l" onclick="adminFeedback()">Feedback</button>
    <button class="l" onclick="show('home')">Logout</button>
  </div>
  <div id="adminBody" class="card"></div>
</section>

</div>

<script>
const SUPABASE_URL="https://dqumlteggtfygpssjtzk.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_Rfvy1drDWb-fXgP37UdEAw_QWg0X_cu";
const ADMIN_CODE="8890";

const EXAM_CONFIGS={
  "AIIMS":{
    title:"AIIMS Hospital Attendant (CRE-5 Group Code 16)",
    sections:5, questionsPerSection:20, sectionSeconds:18*60,
    correctMarks:4, wrongMarks:-1, totalMarks:400,
    pattern:"100 प्रश्न • 90 मिनट • 5 Sections × 20 प्रश्न • सही +4 / गलत −1"
  },
  "RML":{
    title:"RML Hospital Attendant Grade-II",
    sections:1, questionsPerSection:100, sectionSeconds:120*60,
    correctMarks:1, wrongMarks:-0.25, totalMarks:100,
    pattern:"100 प्रश्न • 120 मिनट • सही +1 / गलत −0.25"
  }
};
let selectedExam="AIIMS";
let examConfig=EXAM_CONFIGS.AIIMS;
const TOTAL_QUESTIONS=100;

let tests=[],test=null,idx=0,answers=[],lastResultId=null;
let sectionIndex=0,sectionEnd=0,sectionTimerRunning=false,submitted=false;

const $=x=>document.getElementById(x);

function show(x){
  ["home","student","exam","result","admin"].forEach(y=>$(y).classList.add("hide"));
  $(x).classList.remove("hide");
}

async function api(t,m="GET",b=null,q=""){
  const h={
    "apikey":SUPABASE_ANON_KEY,
    "Authorization":"Bearer "+SUPABASE_ANON_KEY,
    "Content-Type":"application/json",
    "Prefer":"return=representation"
  };
  const r=await fetch(SUPABASE_URL+"/rest/v1/"+t+q,{
    method:m,
    headers:h,
    body:b?JSON.stringify(b):null
  });
  if(!r.ok)throw Error(await r.text());
  return r.status===204?null:r.json();
}

function chooseExam(type){
  if(!EXAM_CONFIGS[type])return alert("कृपया AIIMS या RML चुनें।");
  selectedExam=type;
  examConfig=EXAM_CONFIGS[type];
  $("timer").textContent=String(Math.floor(examConfig.sectionSeconds/60)).padStart(2,"0")+":00";
  student();
}

async function loadStudentTests(){
  try{
    const mobile=$("mobile").value.trim();

    tests=await api(
      "tests",
      "GET",
      null,
      "?select=id,name,duration,questions,exam_type&published=eq.true&exam_type=eq."+
      encodeURIComponent(selectedExam)+"&order=id.desc"
    );

    let completed=[];
    if(/^\d{10}$/.test(mobile)){
      completed=await api(
        "results",
        "GET",
        null,
        "?select=id,test_id,score,correct,wrong,skipped,exam_type&mobile=eq."+
        encodeURIComponent(mobile)+"&exam_type=eq."+encodeURIComponent(selectedExam)+
        "&order=id.asc"
      );
    }

    const completedByTest={};
    (completed||[]).forEach(r=>{ completedByTest[String(r.test_id)]=r; });

    $("tests").innerHTML=tests.map(t=>{
      const done=completedByTest[String(t.id)];
      return `
        <div class="card">
          <b>${esc(t.name)}</b><br>
          ${Array.isArray(t.questions)?t.questions.length:0} प्रश्न<br>
          ${examConfig.pattern}<br>
          कुल ${examConfig.totalMarks} अंक
          <br><br>
          ${done ? `
            <div class="right">
              ✅ <b>यह Test आप पहले दे चुके हैं</b><br>
              Score: <b>${formatScore(done.score)}</b> • सही ${done.correct} • गलत ${done.wrong} • छोड़े ${done.skipped}
            </div>
          ` : `
            <button class="p" onclick="start(${t.id})">▶️ Test शुरू करें</button>
          `}
        </div>`;
    }).join("") || "<p>इस Exam का कोई Published Test नहीं है।</p>";
  }catch(e){
    console.error(e);
    $("tests").innerHTML="<p>Test लोड नहीं हो पाए। Error: "+esc(e?.message||e)+"</p>";
  }
}

async function student(){
  show("student");
  $("studentExamTitle").textContent=examConfig.title+" — विद्यार्थी की जानकारी";
  if($("totalMarksLabel")) $("totalMarksLabel").textContent=examConfig.totalMarks;
  await loadStudentTests();
}

function start(id){
  const mobile=$("mobile").value.trim();
  const firstName=$("firstName").value.trim();
  const lastName=$("lastName").value.trim();

  if(!/^\d{10}$/.test(mobile)) return alert("कृपया 10 अंकों का Mobile Number डालें");
  if(!firstName) return alert("First Name लिखें");
  if(!lastName) return alert("Last Name लिखें");

  test=tests.find(x=>String(x.id)===String(id));
  if(!test||!Array.isArray(test.questions)||test.questions.length!==TOTAL_QUESTIONS)
    return alert("यह Test 100 प्रश्न वाला सही Test नहीं है।");
  if(String(test.exam_type||"")!==String(selectedExam))
    return alert("यह Test इस Exam का नहीं है।");

  idx=0;
  answers=Array(TOTAL_QUESTIONS).fill(null);
  sectionIndex=0;
  submitted=false;
  lastResultId=null;
  startSectionTimer();
  show("exam");
  draw();
}

function startSectionTimer(){
  sectionEnd=Date.now()+examConfig.sectionSeconds*1000;
  sectionTimerRunning=true;
  updateTimerDisplay();

  setTimeout(tickSectionTimer,250);
}

function tickSectionTimer(){
  if(!sectionTimerRunning || submitted)return;

  const remaining=Math.max(0,Math.ceil((sectionEnd-Date.now())/1000));

  updateTimerDisplay(remaining);

  if(remaining<=0){
    sectionTimerRunning=false;
    moveToNextSectionOrSubmit(true);
    return;
  }

  setTimeout(tickSectionTimer,250);
}

function updateTimerDisplay(seconds){
  const s = seconds===undefined
    ? Math.max(0,Math.ceil((sectionEnd-Date.now())/1000))
    : seconds;

  $("timer").textContent=
    String(Math.floor(s/60)).padStart(2,"0")+":"+
    String(s%60).padStart(2,"0");
}

function sectionStart(){
  return sectionIndex*examConfig.questionsPerSection;
}
function sectionEndIndex(){
  return sectionStart()+examConfig.questionsPerSection-1;
}
function sectionName(i){
  return String.fromCharCode(65+i);
}

function draw(){
  if(!test)return;
  const start=sectionStart();
  const end=sectionEndIndex();
  const q=test.questions[idx];

  $("num").textContent=`प्रश्न ${idx+1}/${TOTAL_QUESTIONS} • Section ${sectionName(sectionIndex)}`;
  $("count").textContent=`इस Section में उत्तर दिए: ${answers.slice(start,end+1).filter(x=>x!==null).length}/${examConfig.questionsPerSection}`;
  $("question").textContent=q.q;

  $("options").innerHTML=q.o.map((v,j)=>`
    <button class="${answers[idx]===j?"sel":""}" onclick="selectAnswer(${j})">
      ${"ABCD"[j]}. ${esc(v)}
    </button>
  `).join("");

  $("qgrid").innerHTML=Array.from(
    {length:examConfig.questionsPerSection},
    (_,k)=>{
      const gi=start+k;
      return `<button class="qn ${answers[gi]!==null?"done ":""} ${gi===idx?"cur":""}" onclick="jumpQuestion(${gi})">${gi+1}</button>`;
    }
  ).join("");

  $("prevBtn").disabled=idx<=start;
  $("nextBtn").disabled=idx>=end;
  $("submitBtn").disabled=sectionIndex!==examConfig.sections-1;

  $("sectionInfo").textContent=
    sectionIndex<examConfig.sections-1
    ? `Section ${sectionName(sectionIndex)}: प्रश्न ${start+1}–${end+1}. समय पूरा होने पर Section ${sectionName(sectionIndex+1)} अपने-आप खुलेगा। पिछला Section दोबारा नहीं खोला जा सकेगा।`
    : `Section ${sectionName(sectionIndex)}: प्रश्न ${start+1}–${end+1}. यह आखिरी Section है। समय पूरा होने पर Test अपने-आप Submit होगा।`;

  renderSectionBar();
}

function renderSectionBar(){
  $("sectionBar").innerHTML=Array.from({length:examConfig.sections},(_,i)=>{
    let cls="sectionPill";
    if(i===sectionIndex)cls+=" active";
    if(i<sectionIndex)cls+=" done";
    return `<span class="${cls}">Section ${sectionName(i)} ${i<sectionIndex?"✓":""}</span>`;
  }).join("");
}

function selectAnswer(j){
  if(idx<sectionStart() || idx>sectionEndIndex())return;
  answers[idx]=j;
  draw();
}

function jumpQuestion(globalIndex){
  if(globalIndex<sectionStart() || globalIndex>sectionEndIndex())return;
  idx=globalIndex;
  draw();
}

function next(){
  const end=sectionEndIndex();
  if(idx<end){
    idx++;
    draw();
  }
}

function prev(){
  const start=sectionStart();
  if(idx>start){
    idx--;
    draw();
  }
}

function clearAnswer(){
  answers[idx]=null;
  draw();
}

function moveToNextSectionOrSubmit(auto=true){
  if(sectionIndex<examConfig.sections-1){
    sectionIndex++;
    idx=sectionStart();
    startSectionTimer();
    draw();
    if(auto){
      alert(`Section ${sectionName(sectionIndex-1)} का समय पूरा हो गया। अब Section ${sectionName(sectionIndex)} शुरू हो गया है। पिछला Section लॉक है।`);
    }
  }else{
    submitTest(true);
  }
}

function formatScore(v){
  const n=Number(v);
  return Number.isInteger(n)?String(n):n.toFixed(2);
}

async function submitTest(auto=false){
  if(submitted)return;
  if(sectionIndex!==examConfig.sections-1)
    return alert("आखिरी Section पूरा होने के बाद ही Test Submit होगा।");
  if(!auto&&!confirm("क्या पूरा Test Submit करना है?"))return;

  submitted=true;
  sectionTimerRunning=false;

  let c=0,w=0,s=0;
  answers.forEach((v,k)=>{
    if(v===null)s++;
    else if(v===test.questions[k].a)c++;
    else w++;
  });

  const score=Number((c*examConfig.correctMarks+w*examConfig.wrongMarks).toFixed(2));
  const reviewData=test.questions.map((q,k)=>({
    user:answers[k],correctIndex:q.a,correct:answers[k]===q.a
  }));

  try{
    const rows=await api("results","POST",{
      test_id:test.id,
      exam_type:selectedExam,
      student_name:$('firstName').value.trim()+" "+$('lastName').value.trim(),
      mobile:$('mobile').value.trim(),
      score,correct:c,wrong:w,skipped:s,answers,review:reviewData
    });

    if(!Array.isArray(rows)||!rows[0]||rows[0].id==null)
      throw Error("Result database में insert हुआ लेकिन ID नहीं मिला।");

    lastResultId=rows[0].id;

    const ranks=await api("results","GET",null,
      "?select=id,score&test_id=eq."+encodeURIComponent(test.id)+"&exam_type=eq."+encodeURIComponent(selectedExam)+"&order=score.desc,id.asc");

    const me=ranks.findIndex(x=>String(x.id)===String(lastResultId))+1;
    show("result");
    if($("totalMarksLabel")) $("totalMarksLabel").textContent=examConfig.totalMarks;
    $("score").textContent=formatScore(score);
    $("correct").textContent=c;
    $("wrong").textContent=w;
    $("skipped").textContent=s;
    $("rank").textContent="आपकी Rank: "+(me>0?me:"—");

    $("review").innerHTML=
      `<p><b>${esc(examConfig.title)}</b> • कुल ${examConfig.totalMarks} अंक</p>`+
      test.questions.map((q,k)=>`
        <div class="${answers[k]===q.a?"right":"wrong"}">
          <b>Q${k+1}. ${esc(q.q)}</b><br>
          विद्यार्थी ने चुना: <b>${answers[k]===null?"कोई उत्तर नहीं":"ABCD"[answers[k]]+". "+esc(q.o[answers[k]])}</b><br>
          सही उत्तर: <b>${"ABCD"[q.a]}. ${esc(q.o[q.a])}</b><br>
          ${answers[k]===q.a
            ?`✅ सही (+${examConfig.correctMarks})`
            :answers[k]===null
            ?"0 अंक"
            :`❌ गलत (${examConfig.wrongMarks})`}
        </div>
      `).join("");
  }catch(e){
    submitted=false;
    console.error("RESULT SAVE ERROR:",e);
    alert("Result save नहीं हुआ: "+(e?.message||e));
  }
}

async function sendFeedback(){
  const m=$("feedback").value.trim();
  if(!m||!lastResultId)return;

  try{
    await api(
      "feedback",
      "POST",
      {result_id:lastResultId,message:m}
    );
    $("feedback").value="";
    alert("Feedback भेज दिया गया।");
  }catch(e){
    console.error(e);
    alert("Feedback save नहीं हुआ।");
  }
}

function adminLogin(){
  if(prompt("Owner Code")!==ADMIN_CODE)
    return alert("गलत Owner Code");
  show("admin");
  adminTests();
}

async function adminTests(){
  // Import controls are rendered immediately, independently of the database.
  // This prevents a temporary Supabase/network error from hiding JSON upload buttons.
  const body=$("adminBody");
  body.innerHTML=`
    <h3>Tests</h3>
    <button class="p" onclick="newTest()">+ नया Test जोड़ें</button>

    <div class="importbox">
      <b>AIIMS Hospital Attendant</b><br>
      <button class="p" onclick="document.getElementById('aiimsJsonFile').click()">📥 AIIMS JSON Import</button>
      <input id="aiimsJsonFile" type="file" accept=".json,application/json" class="hide" onchange="importExamJSON(event,'AIIMS')">
      <br><br>
      <b>RML Hospital Attendant</b><br>
      <button class="g" onclick="document.getElementById('rmlJsonFile').click()">📥 RML JSON Import</button>
      <input id="rmlJsonFile" type="file" accept=".json,application/json" class="hide" onchange="importExamJSON(event,'RML')">
      <p>AIIMS की JSON फाइल AIIMS में और RML की JSON फाइल RML में Import होगी। प्रत्येक फाइल में 100 प्रश्न होने चाहिए।</p>
    </div>

    <p id="adminLoadStatus">टेस्ट सूची लोड हो रही है...</p>
    <div id="testList"></div>
  `;

  try{
    const allTests=await api("tests","GET",null,"?select=id,name,duration,questions,published,exam_type&order=id.desc");
    const r=(allTests||[]).filter(t=>Object.prototype.hasOwnProperty.call(EXAM_CONFIGS,t.exam_type));
    $("testList").innerHTML=r.map(t=>`
      <div class="card">
        <b>${esc(t.name)}</b><br>
        <b>Exam:</b> ${esc(EXAM_CONFIGS[t.exam_type]?.title||t.exam_type||"Unknown")} • ${t.published?"Published":"Draft"}<br>
        ${t.questions?.length||0} प्रश्न • ${t.duration} मिनट<br>
        <button class="l" onclick="toggle(${t.id},${!t.published})">${t.published?"Unpublish":"Publish"}</button>
        <button class="d" onclick="deleteTest(${t.id})">Delete</button>
      </div>
    `).join("") || "<p>अभी कोई AIIMS या RML Test सेव नहीं है। ऊपर JSON Import से फाइल चुनें।</p>";
    $("adminLoadStatus").textContent="टेस्ट सूची लोड हो गई। JSON Import विकल्प ऊपर उपलब्ध हैं।";
  }catch(e){
    console.error("ADMIN TEST LIST ERROR:",e);
    $("adminLoadStatus").innerHTML="टेस्ट सूची लोड नहीं हुई: "+esc(e?.message||e)+"<br>JSON Import विकल्प ऊपर उपलब्ध हैं; डेटाबेस की समस्या के कारण सेव/लिस्ट में दिक्कत हो सकती है।";
    $("testList").innerHTML="";
  }
}

function newTest(initialType="AIIMS"){
  $("adminBody").innerHTML=`
    <h3>नया 100 प्रश्न वाला Test</h3>

    <label>Exam चुनें</label>
    <select id="examType" onchange="updateAdminTiming()">
      <option value="AIIMS">AIIMS Hospital Attendant</option>
      <option value="RML">RML Hospital Attendant Grade-II</option>
    </select>

    <label>Test का नाम</label>
    <input id="tname" value="AIIMS Hospital Attendant - Test 1">

    <label>समय (auto)</label>
    <input id="tdur" type="number" value="90" readonly>

    <p id="adminExamInfo">AIIMS: 100 प्रश्न • 90 मिनट • 5 Sections × 20 प्रश्न • +4 / −1</p>

    <div class="importbox">
      <b>📥 Bulk Import</b>
      <p>JSON फ़ाइल चुनें। इससे 100 प्रश्न अपने-आप भरेंगे।</p>

      <button class="g" onclick="document.getElementById('newJsonFile').click()">
        JSON फ़ाइल चुनें
      </button>

      <input id="newJsonFile"
        type="file"
        accept=".json,application/json"
        class="hide"
        onchange="importIntoBuilder(event)">

      <span id="importStatus"></span>
    </div>

    <div id="builder"></div>

    <button class="p" onclick="saveBuilder(false)">Save Draft</button>
    <button class="g" onclick="saveBuilder(true)">Save & Publish</button>
    <button class="l" onclick="adminTests()">वापस</button>
  `;

  $("examType").value=EXAM_CONFIGS[initialType]?initialType:"AIIMS";
  updateAdminTiming();
  renderBuilder(
    Array.from({length:100},()=>({q:"",o:["","","",""],a:0}))
  );
}

function updateAdminTiming(){
  const type=$("examType").value;
  const config=EXAM_CONFIGS[type]||EXAM_CONFIGS.AIIMS;
  $("tname").value=config.title+" - Test 1";
  $("tdur").value=config.sections*config.sectionSeconds/60;
  $("adminExamInfo").textContent=config.pattern;
}

function renderBuilder(qs){
  const b=$("builder");

  b.innerHTML=
    `<p><b>${qs.length} प्रश्न तैयार हैं।</b> सही उत्तर चुनें।</p>`+
    qs.map((q,i)=>`
      <div class="qedit">
        <h4>प्रश्न ${i+1}</h4>

        <input
          id="q${i}"
          placeholder="प्रश्न लिखें"
          value="${attr(q.q)}">

        <input
          id="o${i}a"
          placeholder="A विकल्प"
          value="${attr(q.o[0]||"")}">

        <input
          id="o${i}b"
          placeholder="B विकल्प"
          value="${attr(q.o[1]||"")}">

        <input
          id="o${i}c"
          placeholder="C विकल्प"
          value="${attr(q.o[2]||"")}">

        <input
          id="o${i}d"
          placeholder="D विकल्प"
          value="${attr(q.o[3]||"")}">

        <label>सही उत्तर:</label>

        <select id="a${i}">
          <option value="0" ${q.a===0?"selected":""}>A</option>
          <option value="1" ${q.a===1?"selected":""}>B</option>
          <option value="2" ${q.a===2?"selected":""}>C</option>
          <option value="3" ${q.a===3?"selected":""}>D</option>
        </select>
      </div>
    `).join("");
}

function normalizeImportedQuestions(list){
  if(!Array.isArray(list)) throw Error("questions array नहीं मिला");
  return list.map((q,i)=>{
    const question=q.q??q.question??"";
    const options=q.o??q.options??[];
    let a=q.a;
    if(a==null) a=q.correctAnswer;
    if(typeof a==="string"){
      const s=a.trim().toUpperCase();
      if(/^[ABCD]$/.test(s)) a=s.charCodeAt(0)-65;
      else if(/^\d+$/.test(s)) a=Number(s);
    }
    a=Number(a);
    if(!question||!Array.isArray(options)||options.length!==4||![0,1,2,3].includes(a))
      throw Error("प्रश्न "+(i+1)+" का format गलत है");
    return {q:String(question),o:options.map(String),a};
  });
}

function importExamJSON(ev, examType){
  const f=ev.target.files && ev.target.files[0];
  if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      if(!EXAM_CONFIGS[examType])throw Error("अमान्य Exam चुना गया है");
      const data=JSON.parse(reader.result);
      const questions=normalizeImportedQuestions(data.questions);
      if(questions.length!==100)throw Error("JSON फाइल में ठीक 100 प्रश्न होने चाहिए");

      newTest(examType);
      $("tname").value=data.name||data.test_name||(
        EXAM_CONFIGS[examType].title+" - Test 1"
      );
      renderBuilder(questions);
      $("importStatus").textContent=" ✅ "+EXAM_CONFIGS[examType].title+" के 100 प्रश्न Import हो गए। अब Save Draft या Save & Publish दबाएँ।";
    }catch(e){
      alert(EXAM_CONFIGS[examType]?.title+" JSON Import नहीं हुआ: "+e.message);
    }finally{
      ev.target.value="";
    }
  };
  reader.onerror=()=>alert("JSON फाइल पढ़ी नहीं जा सकी।");
  reader.readAsText(f,"UTF-8");
}

function importIntoBuilder(ev){
  const f=ev.target.files && ev.target.files[0];
  if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      const questions=normalizeImportedQuestions(data.questions);
      if(questions.length!==100)throw Error("फाइल में ठीक 100 प्रश्न होने चाहिए");
      if(data.exam_type && data.exam_type!==$("examType").value){
        throw Error("यह JSON दूसरे Exam की है। ऊपर सही Exam चुनें या संबंधित Import बटन इस्तेमाल करें।");
      }
      if(data.name||data.test_name)$("tname").value=data.name||data.test_name;
      renderBuilder(questions);
      $("importStatus").textContent=" ✅ 100 प्रश्न Import हो गए। अब Save Draft या Save & Publish दबाएँ।";
    }catch(e){
      alert("JSON Import नहीं हुआ: "+e.message);
    }finally{
      ev.target.value="";
    }
  };
  reader.onerror=()=>alert("JSON फाइल पढ़ी नहीं जा सकी।");
  reader.readAsText(f,"UTF-8");
}

function importJSON(ev){
  importIntoBuilder(ev);
}

function collectBuilder(){
  const qs=[];

  for(let i=0;i<100;i++){
    const q=$("q"+i).value.trim();

    const o=[
      $("o"+i+"a").value.trim(),
      $("o"+i+"b").value.trim(),
      $("o"+i+"c").value.trim(),
      $("o"+i+"d").value.trim()
    ];

    const a=Number($("a"+i).value);

    if(!q||o.some(x=>!x))
      throw Error("प्रश्न "+(i+1)+" अधूरा है");

    qs.push({q,o,a});
  }

  return qs;
}

async function saveBuilder(publish){
  try{
    const qs=collectBuilder();
    const type=$("examType").value;
    const config=EXAM_CONFIGS[type];
    if(!config)throw Error("कृपया AIIMS या RML Exam चुनें।");
    const name=$("tname").value.trim()||(config.title+" - Test 1");
    const duration=config.sections*config.sectionSeconds/60;

    if(qs.length!==100)throw Error("Test में 100 प्रश्न होने चाहिए।");

    await api("tests","POST",{name,duration,questions:qs,published:publish,exam_type:type});

    alert(publish?"Test Publish हो गया।":"Test Draft में Save हो गया।");
    adminTests();
  }catch(e){
    console.error(e);
    alert("Save नहीं हुआ: "+e.message);
  }
}

async function toggle(id,v){
  try{
    await api(
      "tests",
      "PATCH",
      {published:v},
      "?id=eq."+id
    );
    adminTests();
  }catch(e){
    console.error(e);
    alert("Publish बदल नहीं पाया।");
  }
}

async function deleteTest(id){
  if(!confirm("क्या यह Test हटाना है?"))return;

  try{
    await api(
      "tests",
      "DELETE",
      null,
      "?id=eq."+id
    );
    adminTests();
  }catch(e){
    console.error(e);
    alert("Delete नहीं हुआ।");
  }
}

async function adminResults(filterExam=null){
  try{
    const params=filterExam
      ? "?select=id,test_id,exam_type,student_name,mobile,score,correct,wrong,skipped,answers,review,created_at&exam_type=eq."+encodeURIComponent(filterExam)+"&order=test_id.asc,score.desc,id.asc"
      : "?select=id,test_id,exam_type,student_name,mobile,score,correct,wrong,skipped,answers,review,created_at&order=exam_type.asc,test_id.asc,score.desc,id.asc";
    const r=await api("results","GET",null,params);
    const sorted=(r||[]).filter(x=>Object.prototype.hasOwnProperty.call(EXAM_CONFIGS,x.exam_type))
      .sort((a,b)=>String(a.exam_type).localeCompare(String(b.exam_type))||Number(a.test_id)-Number(b.test_id)||Number(b.score)-Number(a.score)||Number(a.id)-Number(b.id));

    const testNames={};
    for(const t of (await api("tests","GET",null,"?select=id,name"))) testNames[String(t.id)]=t.name;

    const groups={};
    sorted.forEach(x=>{
      const key=String(x.exam_type||"AIIMS")+"|"+String(x.test_id);
      (groups[key]??=[]).push(x);
    });

    let html=`
      <h3>सभी Results / Rank</h3>
      <div class="sectionBar">
        <button class="l" onclick="adminResults()">सभी</button>
        <button class="p" onclick="adminResults('AIIMS')">AIIMS Hospital Attendant</button>
        <button class="g" onclick="adminResults('RML')">RML Hospital Attendant</button>
      </div>`;

    Object.keys(groups).forEach(key=>{
      const rows=groups[key];
      const testId=rows[0].test_id;
      const examType=rows[0].exam_type||"AIIMS";
      html+=`<div class="card"><h3>${esc(examType)} — ${esc(testNames[String(testId)]||("Test "+testId))}</h3>`;
      html+=`<table><tr><th>Rank</th><th>नाम</th><th>Mobile</th><th>अंक</th><th>सही</th><th>गलत</th><th>छोड़े</th><th>Details</th></tr>`;
      rows.forEach((x,i)=>{
        html+=`<tr>
          <td>${i+1}</td><td>${esc(x.student_name)}</td><td>${esc(x.mobile||"")}</td>
          <td>${formatScore(x.score)}</td><td>${x.correct}</td><td>${x.wrong}</td><td>${x.skipped}</td>
          <td><button class="l" onclick="adminViewResult(${x.id})">देखें</button></td>
        </tr>`;
      });
      html+=`</table></div>`;
    });
    $("adminBody").innerHTML=html+(sorted.length?"":"<p>अभी कोई Result नहीं है।</p>");
  }catch(e){
    console.error(e);
    alert("Results नहीं आ रहे: "+(e?.message||e));
  }
}

async function adminViewResult(resultId){
  try{
    const rows=await api("results","GET",null,"?select=id,test_id,exam_type,student_name,mobile,score,correct,wrong,skipped,answers,review,created_at&id=eq."+encodeURIComponent(resultId));
    if(!rows[0]) throw Error("Result नहीं मिला");
    const r=rows[0];
    const ts=await api("tests","GET",null,"?select=id,name,questions&id=eq."+encodeURIComponent(r.test_id));
    const t=ts[0];
    const qs=Array.isArray(t?.questions)?t.questions:[];
    const ans=Array.isArray(r.answers)?r.answers:[];
    const review=Array.isArray(r.review)?r.review:[];

    let html=`<button class="l" onclick="adminResults('${esc(r.exam_type||"AIIMS")}')">← वापस</button>
      <h3>${esc(r.exam_type||"AIIMS")} — ${esc(t?.name||("Test "+r.test_id))}</h3>
      <p><b>नाम:</b> ${esc(r.student_name)}<br><b>Mobile:</b> ${esc(r.mobile||"")}<br><b>Score:</b> ${formatScore(r.score)} • सही ${r.correct} • गलत ${r.wrong} • छोड़े ${r.skipped}</p>`;
    html+=qs.map((q,k)=>{
      const user=ans[k]; const correct=review[k]?.correctIndex??q.a;
      const cls=user===correct?"right":(user==null?"card":"wrong");
      return `<div class="${cls}"><b>Q${k+1}. ${esc(q.q)}</b><br>विद्यार्थी: <b>${user==null?"कोई उत्तर नहीं":("ABCD"[user]+". "+esc(q.o[user]))}</b><br>सही: <b>${"ABCD"[correct]}. ${esc(q.o[correct])}</b></div>`;
    }).join("");
    $("adminBody").innerHTML=html;
  }catch(e){ alert("Result details नहीं खुल रहे: "+(e?.message||e)); }
}

async function adminFeedback(){
  try{
    const r=await api("feedback");

    $("adminBody").innerHTML=
      "<h3>Feedback</h3>"+
      r.map(x=>`
        <div class="card">
          ${esc(x.message)}
        </div>
      `).join("");

  }catch(e){
    console.error(e);
    alert("Feedback नहीं आ रहा।");
  }
}

function esc(s){
  return String(s??"").replace(
    /[&<>"']/g,
    c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );
}

function attr(s){
  return esc(s);
}
